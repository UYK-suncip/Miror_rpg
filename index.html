<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>거울굴절철도 — THE WARDEN</title>
<style>
:root{color-scheme:dark;--ice:#79cfff;--blue:#347bff;--ink:#080d1d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b18;color:#e8f3ff;font-family:ui-monospace,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#080e20;isolation:isolate}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px #030713,0 0 8px #07142d;font-weight:900}
.panel{position:absolute;background:linear-gradient(135deg,#111b34eF,#080f24eF);border:2px solid #738dbd;border-radius:4px;box-shadow:0 4px 0 #030611, inset 0 0 18px #4164a333;padding:7px 10px}
#playerPanel{left:clamp(12px,5vw,76px);top:clamp(14px,6vh,62px);width:min(255px,36vw);padding:8px 12px 8px 68px;border:0;background:transparent;box-shadow:none}\n#playerPanel:before{content:"";position:absolute;left:-52px;top:-10px;width:68px;height:68px;border-radius:50%;border:5px solid #7785aa;background:radial-gradient(circle at 40% 35%,#8295bf,#263452 65%,#080e20);box-shadow:0 0 0 3px #080d1c,0 0 0 5px #526487;z-index:1}\n#playerPanel:after{content:"";position:absolute;left:-40px;top:2px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#a2b4db,#4c5d86 58%,#131d38);border:2px solid #121b32;z-index:2;box-shadow:inset 0 -8px #10172b}
#bossPanel{left:auto;right:clamp(16px,8vw,112px);top:clamp(14px,3vh,34px);transform:none;width:min(290px,35vw);text-align:right;padding:0 0 0 0;border:0;background:transparent;box-shadow:none}\n#bossPanel:after{content:"";position:absolute;right:-72px;top:17px;width:58px;height:58px;border:5px solid #65769c;border-radius:50%;background:radial-gradient(circle at 55% 45%,#a6f5ff 0 5%,#1a9eff 10%,#071b52 36%,#0a1020 68%);box-shadow:0 0 0 3px #080d1c,0 0 0 5px #394969,0 0 22px #247dff}
.name{font-size:11px;letter-spacing:2px;color:#b8d7ff}
.hpOuter{height:14px;margin-top:5px;background:#050a18;border:2px solid #7c91b5;box-shadow:inset 0 0 5px #000;overflow:hidden}
.hpFill{height:100%;width:100%;transition:width .12s;background:linear-gradient(180deg,#a4ffdc,#24a87b 55%,#12654f)}
#bossFill{background:linear-gradient(180deg,#ffb0c2,#e53b6b 55%,#8c1b43)}
.hpNum{font-size:10px;color:#b6c9e9;margin-top:3px}
#bossTitle{font-size:clamp(13px,1.8vw,20px);letter-spacing:2px;color:#f2f5ff;font-weight:1000;text-shadow:2px 2px #050816}
#bossSub{display:none}
#centerMsg{display:none}
#toast{position:absolute;top:39%;left:50%;transform:translate(-50%,-50%);font-size:clamp(15px,3vw,24px);letter-spacing:3px;color:#bcecff;opacity:0;transition:opacity .15s;text-align:center;white-space:nowrap}
#toast.show{opacity:1}
#bottomHud{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#8fa9d1;white-space:nowrap}
#controls{position:absolute;inset:0;pointer-events:none}
.control{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;appearance:none;border:2px solid #a8c7f0a8;background:linear-gradient(145deg,#1c3158d9,#0a142bdc);color:#eff8ff;box-shadow:inset 0 0 15px #5a9cff3b,0 4px 10px #000a,0 0 10px #2866b544;border-radius:50%;display:grid;place-items:center;font-weight:900;text-shadow:0 2px #111;font-size:18px;padding:0;outline:none}
.control:active,.control.down{background:linear-gradient(145deg,#4d8be8,#142c59);box-shadow:inset 0 0 18px #a5dcff99,0 0 18px #5d9cff}
.skill{position:absolute;bottom:max(9vh,42px);width:clamp(72px,12vw,112px);height:clamp(72px,12vw,112px);border:2px solid #aabbd8aa;background:radial-gradient(circle at 40% 32%,#35425cdd,#0a1229ee 72%);box-shadow:inset 0 0 0 4px #101a32, inset 0 0 20px #72aaff44,0 4px 10px #000b}
.skill b{font-size:clamp(24px,3vw,34px);text-shadow:0 0 8px #b7dcff}.skill small{position:absolute;top:-13px;bottom:auto;font-size:clamp(13px,1.6vw,19px);font-weight:1000;color:#fff;text-shadow:2px 2px #050816;letter-spacing:0}
#q{right:calc(25% + 4px)}#e{right:calc(13% + 2px)}#r{right:14px}
#joy{position:absolute;left:clamp(22px,5vw,76px);bottom:max(7vh,35px);width:clamp(142px,18vw,220px);height:clamp(142px,18vw,220px);border-radius:50%;background:radial-gradient(circle,#25355088,#101a337a 65%,#0b1328aa);border:3px solid #b6c7e18c;box-shadow:inset 0 0 22px #b8d7ff22,0 0 15px #0009;pointer-events:auto;touch-action:none}
#joy:before{content:"";position:absolute;inset:13%;border:1px dashed #91b5e54a;border-radius:50%}
#stick{position:absolute;left:50%;top:50%;width:40%;height:40%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#c7d8edaa,#7185a6aa 55%,#344563dd);border:3px solid #c5d5e8b8;box-shadow:0 0 18px #6bafff66;pointer-events:none}
#pause{position:absolute;right:13px;top:90px;width:38px;height:38px;border-radius:7px;font-size:15px}
#cooldowns{position:absolute;right:14px;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 87px);display:flex;gap:8px;pointer-events:none}
.cool{font-size:9px;color:#d5e5ff;background:#091329c9;border:1px solid #718db9;padding:3px 5px;min-width:35px;text-align:center}
@media(orientation:landscape){#playerPanel{width:230px}#bossPanel{width:245px}#joy{width:150px;height:150px}.skill{width:82px;height:82px}#q{right:calc(25% + 4px)}#pause{top:13px}}
@media(max-width:560px){#playerPanel{width:36vw;padding:6px}#bossPanel{width:48vw;padding:6px}#bossTitle{font-size:11px}#bossSub{font-size:8px}.name{font-size:9px}#playerPanel .hpOuter{height:11px}#centerMsg{top:24%}#bottomHud{display:none}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud">
 <div id="playerPanel" class="panel"><div class="name">HP&nbsp; 100 / 100</div><div class="hpOuter"><div id="playerFill" class="hpFill"></div></div><div id="playerNum" class="hpNum">VITALITY 100 / 100</div></div>
 <div id="bossPanel" class="panel"><div id="bossTitle">THE WARDEN</div><div class="hpOuter"><div id="bossFill" class="hpFill"></div></div><div id="bossNum" class="hpNum">300 / 300</div></div>
 <div id="centerMsg">푸른 균열의 수호자</div><div id="toast"></div><div id="bottomHud">WASD / ARROWS · Q DASH · E SHOCKWAVE · R COUNTER</div>
</div>
<div id="controls">
 <div id="joy"><div id="stick"></div></div>
 <button id="q" class="control skill" aria-label="Q 돌진 베기"><small>Q</small><b>⚔</b></button>
 <button id="e" class="control skill" aria-label="E 충격파"><small>E</small><b>✺</b></button>
 <button id="r" class="control skill" aria-label="R 반격"><small>R</small><b>⬡</b></button>
 <button id="pause" class="control" aria-label="일시정지">Ⅱ</button>
 <div id="cooldowns"><span id="cq" class="cool">Q READY</span><span id="ce" class="cool">E READY</span><span id="cr" class="cool">R READY</span></div>
</div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
let W=900,H=620,D=1,last=0,elapsed=0,paused=false,toastTime=0,shake=0;
const player={x:450,y:490,hp:100,max:100,dir:'up',speed:205,inv:0,dash:0,guard:0,attack:0};
const boss={x:450,y:245,hp:300,max:300,dir:'down',state:'idle',timer:1.6,attack:0,phase:0};
const move={x:0,y:0};const pointers=new Map(),keys={};const cd={q:0,e:0,r:0};const fx=[],sparks=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=game.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*D*.72);canvas.height=Math.round(H*D*.72);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);player.x=clamp(player.x,35,W-35);player.y=clamp(player.y,100,H-35);boss.x=W/2;boss.y=H*.39}
addEventListener('resize',resize);resize();
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');toastTime=1.05}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*150;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.25+Math.random()*.45,color,size:2+Math.random()*3})}}
function ring(x,y,color,max=100){fx.push({x,y,r:5,max,t:.48,color})}
function hurtBoss(n){if(boss.hp<=0)return;boss.hp=Math.max(0,boss.hp-n);shake=5;ring(boss.x,boss.y,'#79d9ff',86);burst(boss.x,boss.y,'#7bdcff',18);toast('− '+n+' HP');if(!boss.hp){boss.state='dead';toast('THE WARDEN DEFEATED');burst(boss.x,boss.y,'#a4eaff',70)}}
function skill(k){if(paused||player.hp<=0||boss.hp<=0||cd[k]>0)return;
 if(k==='q'){cd.q=2.1;player.dash=.24;const dx=boss.x-player.x,dy=boss.y-player.y,len=Math.hypot(dx,dy)||1;player.dir=direction(dx,dy);const ox=player.x,oy=player.y;player.x=clamp(player.x+dx/len*86,28,W-28);player.y=clamp(player.y+dy/len*86,95,H-28);player.attack=.2;if(Math.hypot(boss.x-player.x,boss.y-player.y)<160)hurtBoss(35);ring(ox,oy,'#d8f4ff',75);burst(player.x,player.y,'#c6edff',12)}
 if(k==='e'){cd.e=5;if(Math.hypot(boss.x-player.x,boss.y-player.y)<178)hurtBoss(25);ring(player.x,player.y,'#5daeff',190);burst(player.x,player.y,'#64aaff',26)}
 if(k==='r'){cd.r=4.5;player.guard=.78;ring(player.x,player.y,'#a2eaff',68);toast('COUNTER STANCE')}
}
function direction(x,y){return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up')}
function joyPoint(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),limit=r.width*.32,len=Math.hypot(dx,dy)||1,m=Math.min(1,limit/len);move.x=dx/len*m;move.y=dy/len*m;stick.style.left=(50+move.x*32)+'%';stick.style.top=(50+move.y*32)+'%'}
function resetJoy(){move.x=0;move.y=0;stick.style.left='50%';stick.style.top='50%'}
function finishPointer(e){const kind=pointers.get(e.pointerId);if(kind==='joy')resetJoy();if(kind&&kind!=='joy'){const b=document.getElementById(kind);if(b)b.classList.remove('down')}pointers.delete(e.pointerId)}
joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pointers.set(e.pointerId,'joy');try{joy.setPointerCapture(e.pointerId)}catch(_){}joyPoint(e)});
joy.addEventListener('pointermove',e=>{if(pointers.get(e.pointerId)==='joy'){e.preventDefault();joyPoint(e)}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(ev,finishPointer);
for(const k of ['q','e','r']){const b=document.getElementById(k);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pointers.set(e.pointerId,k);try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('down');skill(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{finishPointer(e)})}
document.getElementById('pause').addEventListener('pointerdown',e=>{e.preventDefault();paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';toast(paused?'PAUSED':'RESUME')});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['q','e','r'].includes(k)&&!e.repeat)skill(k);if(k==='escape')paused=!paused});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(dt){if(paused)return;elapsed+=dt;for(const k in cd)cd[k]=Math.max(0,cd[k]-dt);player.inv=Math.max(0,player.inv-dt);player.guard=Math.max(0,player.guard-dt);player.dash=Math.max(0,player.dash-dt);player.attack=Math.max(0,player.attack-dt);
 let ix=move.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=move.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l;l=1}if(l>.08){player.dir=direction(ix,iy);player.x+=ix*player.speed*dt*(player.dash?2.4:1);player.y+=iy*player.speed*dt*(player.dash?2.4:1)}
 player.x=clamp(player.x,28,W-28);player.y=clamp(player.y,95,H-28);
 if(boss.hp>0){boss.timer-=dt;if(boss.state==='idle'&&boss.timer<=0){boss.state='tell';boss.timer=.78;boss.attack=Math.random()<.55?0:1;boss.dir=direction(player.x-boss.x,player.y-boss.y);toast(boss.attack===0?'WARDEN · CHARGE':'WARDEN · RIFT IMPACT')}
 if(boss.state==='tell'&&boss.timer<=0){boss.state='attack';boss.timer=.5}
 if(boss.state==='attack'){if(boss.attack===0){const dx=player.x-boss.x,dy=player.y-boss.y,len=Math.hypot(dx,dy)||1;boss.x+=dx/len*210*dt;boss.y+=dy/len*210*dt}if(boss.timer<=0){const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy);if((boss.attack===0&&d<86)||(boss.attack===1&&d<145)){if(player.guard>0){hurtBoss(45);player.guard=0;burst(player.x,player.y,'#b3f2ff',28)}else if(player.inv<=0){player.hp=Math.max(0,player.hp-18);player.inv=.9;shake=8;toast('− 18 VITALITY')}}if(boss.attack===1)ring(boss.x,boss.y,'#387eff',150);boss.state='idle';boss.timer=1.25+Math.random()*1.15}}
 }
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;f.r+=(f.max-f.r)*dt*7;if(f.t<=0)fx.splice(i,1)}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.94;s.vy*=.94;if(s.t<=0)sparks.splice(i,1)}
 if(toastTime>0){toastTime-=dt;if(toastTime<=0)document.getElementById('toast').classList.remove('show')}
 document.getElementById('playerFill').style.width=(player.hp/player.max*100)+'%';document.getElementById('bossFill').style.width=(boss.hp/boss.max*100)+'%';document.getElementById('playerNum').textContent='VITALITY '+player.hp+' / 100';document.getElementById('bossNum').textContent=boss.hp+' / '+boss.max;
 for(const k of ['q','e','r']){const e=document.getElementById('c'+k);e.textContent=cd[k]>0?cd[k].toFixed(1)+'s':k.toUpperCase()+' READY';document.getElementById(k).style.opacity=cd[k]>0?'.62':'1'}
}
function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function path(points,color,width=2,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='miter';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore()}
function drawFloor(){ctx.fillStyle='#090e20';ctx.fillRect(0,0,W,H);
 const tile=Math.max(34,Math.min(58,W/18)),cols=Math.ceil(W/tile)+2,rows=Math.ceil(H/tile)+3;
 for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){const x=gx*tile-tile*.4,y=70+gy*tile,seed=hash(gx,gy),w=tile*(.82+hash(gx+9,gy)*.18),hh=tile*(.78+hash(gx,gy+8)*.2),j=tile*.09;const pts=[[x+j,y+j],[x+w-j*.5,y+hash(gx,gy+2)*j],[x+w,y+hh*.72],[x+w-j,y+hh],[x+j*.5,y+hh-j*.25],[x,y+hh*.25]];ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();const shade=Math.floor(24+seed*17);ctx.fillStyle='rgb('+shade+','+(shade+7)+','+(shade+25)+')';ctx.fill();ctx.strokeStyle='#080d1c';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(x+j+2,y+j+2);ctx.lineTo(x+w-j,y+2);ctx.strokeStyle='rgba(125,148,190,.16)';ctx.lineWidth=2;ctx.stroke();for(let k=0;k<4;k++){let px=x+hash(gx*3+k,gy+14)*w,py=y+hash(gx+20,gy*4+k)*hh;ctx.fillStyle=k===0?'#7885a022':'#050a182b';ctx.fillRect(px,py,3+hash(k,gx)*10,2+hash(gy,k)*4)}if(seed>.72){ctx.strokeStyle='#7585a333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w*.3,y+hh*.2);ctx.lineTo(x+w*.48,y+hh*.46);ctx.lineTo(x+w*.39,y+hh*.65);ctx.stroke()}}
 ctx.save();ctx.globalCompositeOperation='screen';ctx.shadowColor='#155dff';ctx.shadowBlur=18;for(let i=0;i<42;i++){let x=hash(i,4)*W,y=95+hash(i,8)*(H-120),pts=[[x,y]];for(let j=0;j<6;j++){x+=(hash(i*9+j,2)-.5)*58;y+=(hash(i*3,j+7)-.25)*38;pts.push([x,y])}path(pts,'#123dff',8,.30);path(pts,'#235bff',3,.82);path(pts,'#76c4ff',1,.9)}ctx.restore();
 ctx.save();ctx.translate(W*.5,H*.43);ctx.shadowColor='#326cff';ctx.shadowBlur=10;for(let r of [.18,.205,.235]){ctx.beginPath();ctx.ellipse(0,0,W*r,H*r*.66,0,0,Math.PI*2);ctx.strokeStyle=r===.205?'#8490b866':'#65769c88';ctx.lineWidth=r===.205?9:3;ctx.stroke()}ctx.beginPath();ctx.ellipse(0,0,W*.18,H*.115,0,0,Math.PI*2);ctx.strokeStyle='#8495bc99';ctx.lineWidth=5;ctx.stroke();for(let i=0;i<16;i++){let a=i*Math.PI/8;ctx.beginPath();ctx.moveTo(Math.cos(a)*W*.2,Math.sin(a)*H*.13);ctx.lineTo(Math.cos(a)*W*.235,Math.sin(a)*H*.155);ctx.strokeStyle='#7e91b988';ctx.lineWidth=4;ctx.stroke()}ctx.restore();
 for(const side of [0,1]){const x=side?W-72:72;for(let y=H*.18;y<H*.86;y+=H*.36){ctx.fillStyle='#070b18';ctx.fillRect(x-27,y-30,54,106);ctx.fillStyle='#242e4c';ctx.fillRect(x-22,y-35,44,100);ctx.fillStyle='#566587';ctx.fillRect(x-28,y-40,56,9);ctx.fillRect(x-32,y+54,64,12);ctx.fillStyle='#101a35';ctx.fillRect(x-12,y-20,24,65);ctx.save();ctx.shadowColor='#1c72ff';ctx.shadowBlur=25+Math.sin(elapsed*5)*6;ctx.fillStyle='#1e5dff';ctx.beginPath();ctx.moveTo(x,y-34);ctx.lineTo(x-8,y-8);ctx.lineTo(x-4,y+1);ctx.lineTo(x+4,y+1);ctx.lineTo(x+9,y-10);ctx.closePath();ctx.fill();ctx.fillStyle='#b8f5ff';ctx.fillRect(x-2,y-24,4,18);ctx.restore()}}
 for(let i=0;i<65;i++){let x=hash(i,20)*W,y=90+hash(i,30)*(H-105);if(Math.abs(x-W/2)<W*.17&&Math.abs(y-H*.4)<H*.12)continue;let s=5+hash(i,4)*17;ctx.fillStyle='#080d1b';ctx.fillRect(x+3,y+4,s,s*.55);ctx.fillStyle=i%2?'#35415f':'#424d6b';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y+2);ctx.lineTo(x+s*.8,y+s*.55);ctx.lineTo(x+2,y+s*.7);ctx.closePath();ctx.fill();ctx.fillStyle='#7785a522';ctx.fillRect(x+2,y+1,s*.45,2)}
 const pool=ctx.createRadialGradient(W*.5,H*.42,8,W*.5,H*.42,W*.43);pool.addColorStop(0,'#225bff20');pool.addColorStop(1,'#0b1b4400');ctx.fillStyle=pool;ctx.fillRect(0,65,W,H-65);const vg=ctx.createRadialGradient(W/2,H/2,H*.12,W/2,H/2,H*.8);vg.addColorStop(0,'#0000');vg.addColorStop(1,'#020511d9');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawWarden(){if(boss.hp<=0)return;ctx.save();ctx.translate(boss.x,boss.y+Math.sin(elapsed*2.8)*3);
 // ground shadow + rift pool
 ctx.save();ctx.shadowColor='#126aff';ctx.shadowBlur=24;ctx.fillStyle='#102d85a8';ctx.beginPath();ctx.ellipse(0,43,82,26,0,0,Math.PI*2);ctx.fill();ctx.restore();
