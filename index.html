<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>거울굴절철도 — THE WARDEN</title>
<style>
:root{color-scheme:dark;--ice:#79cfff;--blue:#347bff;--ink:#080d1d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b18;color:#e8f3ff;font-family:ui-monospace,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#080e20;isolation:isolate}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px #030713,0 0 8px #07142d;font-weight:900}
.panel{position:absolute;background:linear-gradient(135deg,#111b34eF,#080f24eF);border:2px solid #738dbd;border-radius:4px;box-shadow:0 4px 0 #030611, inset 0 0 18px #4164a333;padding:7px 10px}
#playerPanel{left:clamp(12px,5vw,76px);top:clamp(14px,6vh,62px);width:min(255px,36vw);padding:8px 12px 8px 68px;border:0;background:transparent;box-shadow:none}
#playerPanel:before{content:"";position:absolute;left:-52px;top:-10px;width:68px;height:68px;border-radius:50%;border:5px solid #7785aa;background:radial-gradient(circle at 40% 35%,#8295bf,#263452 65%,#080e20);box-shadow:0 0 0 3px #080d1c,0 0 0 5px #526487;z-index:1}
#playerPanel:after{content:"";position:absolute;left:-40px;top:2px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#a2b4db,#4c5d86 58%,#131d38);border:2px solid #121b32;z-index:2;box-shadow:inset 0 -8px #10172b}
#bossPanel{left:auto;right:clamp(16px,8vw,112px);top:clamp(14px,3vh,34px);transform:none;width:min(290px,35vw);text-align:right;padding:0 0 0 0;border:0;background:transparent;box-shadow:none}
#bossPanel:after{content:"";position:absolute;right:-72px;top:17px;width:58px;height:58px;border:5px solid #65769c;border-radius:50%;background:radial-gradient(circle at 55% 45%,#a6f5ff 0 5%,#1a9eff 10%,#071b52 36%,#0a1020 68%);box-shadow:0 0 0 3px #080d1c,0 0 0 5px #394969,0 0 22px #247dff}
.name{font-size:11px;letter-spacing:2px;color:#b8d7ff}
.hpOuter{height:14px;margin-top:5px;background:#050a18;border:2px solid #7c91b5;box-shadow:inset 0 0 5px #000;overflow:hidden}
.hpFill{height:100%;width:100%;transition:width .12s;background:linear-gradient(180deg,#a4ffdc,#24a87b 55%,#12654f)}
#bossFill{background:linear-gradient(180deg,#ffb0c2,#e53b6b 55%,#8c1b43)}
.hpNum{font-size:10px;color:#dceaff;margin-top:3px;letter-spacing:1px}#playerPanel .name{font-size:clamp(14px,1.7vw,20px);color:#fff;letter-spacing:1px}#playerPanel .hpOuter,#bossPanel .hpOuter{height:19px;border:2px solid #9eb4d5;border-radius:5px}#bossNum{font-size:clamp(14px,1.7vw,20px);color:#fff;letter-spacing:1px}
#bossTitle{font-size:clamp(13px,1.8vw,20px);letter-spacing:2px;color:#f2f5ff;font-weight:1000;text-shadow:2px 2px #050816}
#bossSub{display:none}
#centerMsg{display:none}
#toast{position:absolute;top:39%;left:50%;transform:translate(-50%,-50%);font-size:clamp(15px,3vw,24px);letter-spacing:3px;color:#bcecff;opacity:0;transition:opacity .15s;text-align:center;white-space:nowrap}
#toast.show{opacity:1}#endScreen{position:absolute;inset:0;display:none;place-items:center;background:#030817b8;pointer-events:auto;z-index:8}#endScreen.show{display:grid}#endCard{min-width:min(78vw,340px);padding:26px 24px;text-align:center;background:linear-gradient(145deg,#172544f5,#080f22f5);border:2px solid #7e9dc9;box-shadow:0 0 45px #236bff55;color:#eff8ff}#endTitle{font-size:clamp(24px,5vw,38px);letter-spacing:3px;margin-bottom:10px}#endText{font-size:12px;color:#b8cde9;letter-spacing:1px;margin-bottom:20px}#retry{border:2px solid #b9d9ff;background:linear-gradient(180deg,#397edb,#15366c);color:white;padding:12px 24px;font:900 14px ui-monospace,monospace;letter-spacing:2px}
#bottomHud{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#8fa9d1;white-space:nowrap}
#controls{position:absolute;inset:0;pointer-events:none}
.control{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;appearance:none;border:2px solid #a8c7f0a8;background:linear-gradient(145deg,#1c3158d9,#0a142bdc);color:#eff8ff;box-shadow:inset 0 0 15px #5a9cff3b,0 4px 10px #000a,0 0 10px #2866b544;border-radius:50%;display:grid;place-items:center;font-weight:900;text-shadow:0 2px #111;font-size:18px;padding:0;outline:none}
.control:active,.control.down{background:linear-gradient(145deg,#4d8be8,#142c59);box-shadow:inset 0 0 18px #a5dcff99,0 0 18px #5d9cff}
.skill{position:absolute;bottom:max(9vh,42px);width:clamp(72px,12vw,112px);height:clamp(72px,12vw,112px);border:2px solid #aabbd8aa;background:radial-gradient(circle at 40% 32%,#35425cdd,#0a1229ee 72%);box-shadow:inset 0 0 0 4px #101a32, inset 0 0 20px #72aaff44,0 4px 10px #000b}
.skill b{font-size:clamp(24px,3vw,34px);text-shadow:0 0 8px #b7dcff}.skill small{position:absolute;top:-13px;bottom:auto;font-size:clamp(13px,1.6vw,19px);font-weight:1000;color:#fff;text-shadow:2px 2px #050816;letter-spacing:0}
#q{right:calc(25% + 4px)}#e{right:calc(13% + 2px)}#r{right:14px}
#joy{position:absolute;left:clamp(22px,5vw,76px);bottom:max(7vh,35px);width:clamp(142px,18vw,220px);height:clamp(142px,18vw,220px);border-radius:50%;background:radial-gradient(circle,#25355088,#101a337a 65%,#0b1328aa);border:3px solid #b6c7e18c;box-shadow:inset 0 0 22px #b8d7ff22,0 0 15px #0009;pointer-events:auto;touch-action:none}
#joy:before{content:"";position:absolute;inset:13%;border:1px dashed #91b5e54a;border-radius:50%}
#stick{position:absolute;left:50%;top:50%;width:40%;height:40%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#c7d8edaa,#7185a6aa 55%,#344563dd);border:3px solid #c5d5e8b8;box-shadow:0 0 18px #6bafff66;pointer-events:none}
#pause{position:absolute;right:13px;top:90px;width:38px;height:38px;border-radius:7px;font-size:15px}
#cooldowns{position:absolute;right:14px;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 87px);display:flex;gap:8px;pointer-events:none}
.cool{font-size:9px;color:#d5e5ff;background:#091329c9;border:1px solid #718db9;padding:3px 5px;min-width:35px;text-align:center}
@media(orientation:landscape){#playerPanel{width:230px}#bossPanel{width:245px}#joy{width:150px;height:150px}.skill{width:82px;height:82px}#q{right:calc(25% + 4px)}#pause{top:13px}}
@media(max-width:560px){#playerPanel{width:36vw;padding:6px}#bossPanel{width:48vw;padding:6px}#bossTitle{font-size:11px}#bossSub{font-size:8px}.name{font-size:9px}#playerPanel .hpOuter{height:11px}#centerMsg{top:24%}#bottomHud{display:none}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="hud">
 <div id="playerPanel" class="panel"><div class="name">HP&nbsp; 100 / 100</div><div class="hpOuter"><div id="playerFill" class="hpFill"></div></div><div id="playerNum" class="hpNum">VITALITY 100 / 100</div></div>
 <div id="bossPanel" class="panel"><div id="bossTitle">THE WARDEN</div><div class="hpOuter"><div id="bossFill" class="hpFill"></div></div><div id="bossNum" class="hpNum">300 / 300</div></div>
 <div id="centerMsg">푸른 균열의 수호자</div><div id="toast"></div><div id="bottomHud">WASD / ARROWS · Q DASH · E SHOCKWAVE · R COUNTER</div>
</div>
<div id="endScreen"><div id="endCard"><div id="endTitle">THE WARDEN</div><div id="endText">THE RIFT IS QUIET</div><button id="retry">RETRY</button></div></div>
<div id="controls">
 <div id="joy"><div id="stick"></div></div>
 <button id="q" class="control skill" aria-label="Q 돌진 베기"><small>Q</small><b>⚔</b></button>
 <button id="e" class="control skill" aria-label="E 충격파"><small>E</small><b>✺</b></button>
 <button id="r" class="control skill" aria-label="R 반격"><small>R</small><b>⬡</b></button>
 <button id="pause" class="control" aria-label="일시정지">Ⅱ</button>
 <div id="cooldowns"><span id="cq" class="cool">Q READY</span><span id="ce" class="cool">E READY</span><span id="cr" class="cool">R READY</span></div>
</div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),game=document.getElementById('game');
const bgCanvas=document.createElement('canvas'),bgCtx=bgCanvas.getContext('2d',{alpha:false});
const wardenSprite=new Image();wardenSprite.src='./assets/warden-toad.png?v=renderfix1';wardenSprite.onerror=()=>console.error('Warden sprite failed to load:',wardenSprite.src);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
let W=900,H=620,D=1,last=0,elapsed=0,paused=false,toastTime=0,shake=0,ended=false;
const player={x:450,y:490,hp:100,max:100,dir:'up',speed:205,inv:0,dash:0,guard:0,attack:0};
const boss={x:450,y:245,hp:300,max:300,dir:'down',state:'idle',timer:1.6,attack:0,phase:0,squash:0,eyeX:0,eyeY:0};
const move={x:0,y:0};const pointers=new Map(),keys={};const cd={q:0,e:0,r:0};const fx=[],sparks=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=game.getBoundingClientRect();D=Math.min(devicePixelRatio||1,1.25);W=r.width;H=r.height;canvas.width=Math.max(1,Math.round(W*D*.72));canvas.height=Math.max(1,Math.round(H*D*.72));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);bgCanvas.width=canvas.width;bgCanvas.height=canvas.height;bgCtx.setTransform(bgCanvas.width/W,0,0,bgCanvas.height/H,0,0);drawFloor();player.x=clamp(player.x,35,W-35);player.y=clamp(player.y,100,H-35);boss.x=W/2;boss.y=H*.39;boss.squash=0;boss.eyeX=0;boss.eyeY=0}
addEventListener('resize',resize);resize();
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');toastTime=1.05}
function burst(x,y,color,n=12){n=Math.min(n,20,Math.max(0,90-sparks.length));for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*150;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.25+Math.random()*.45,color,size:2+Math.random()*3})}}
function ring(x,y,color,max=100){if(fx.length<10)fx.push({x,y,r:5,max,t:.48,color})}
function finishGame(win){ended=true;paused=true;const p=document.getElementById('endScreen');document.getElementById('endTitle').textContent=win?'VICTORY':'DEFEATED';document.getElementById('endText').textContent=win?'THE WARDEN HAS FALLEN':'THE RIFT CLAIMS ANOTHER WANDERER';p.classList.add('show')}
function hurtBoss(n){if(boss.hp<=0)return;boss.hp=Math.max(0,boss.hp-n);shake=5;ring(boss.x,boss.y,'#79d9ff',86);burst(boss.x,boss.y,'#7bdcff',18);toast('− '+n+' HP');if(!boss.hp){boss.state='dead';toast('THE WARDEN DEFEATED');burst(boss.x,boss.y,'#a4eaff',70);setTimeout(()=>finishGame(true),650)}}
function restart(){player.x=W*.5;player.y=H*.79;player.hp=100;player.inv=0;player.guard=0;player.attack=0;player.dash=0;player.dir='up';boss.x=W*.5;boss.y=H*.39;boss.hp=300;boss.state='idle';boss.timer=1.6;boss.attack=0;boss.squash=0;boss.eyeX=0;boss.eyeY=0;boss.baseAngle=0;boss.hit=false;for(const k of ['q','e','r'])cd[k]=0;fx.length=0;sparks.length=0;paused=false;ended=false;document.getElementById('endScreen').classList.remove('show');document.getElementById('pause').textContent='Ⅱ';toast('THE WARDEN AWAKENS')}
document.getElementById('retry').addEventListener('click',restart);
function skill(k){if(paused||player.hp<=0||boss.hp<=0||cd[k]>0)return;
 if(k==='q'){cd.q=2.1;player.dash=.24;const dx=boss.x-player.x,dy=boss.y-player.y,len=Math.hypot(dx,dy)||1;player.dir=direction(dx,dy);const ox=player.x,oy=player.y;player.x=clamp(player.x+dx/len*86,28,W-28);player.y=clamp(player.y+dy/len*86,95,H-28);player.attack=.2;if(Math.hypot(boss.x-player.x,boss.y-player.y)<160)hurtBoss(35);ring(ox,oy,'#d8f4ff',75);burst(player.x,player.y,'#c6edff',12)}
 if(k==='e'){cd.e=5;if(Math.hypot(boss.x-player.x,boss.y-player.y)<178)hurtBoss(25);ring(player.x,player.y,'#5daeff',190);burst(player.x,player.y,'#64aaff',26)}
 if(k==='r'){cd.r=4.5;player.guard=.78;ring(player.x,player.y,'#a2eaff',68);toast('COUNTER STANCE')}
}
function direction(x,y){return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up')}
function joyPoint(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),limit=r.width*.32,len=Math.hypot(dx,dy)||1,m=Math.min(1,limit/len);move.x=dx/len*m;move.y=dy/len*m;stick.style.left=(50+move.x*32)+'%';stick.style.top=(50+move.y*32)+'%'}
function resetJoy(){move.x=0;move.y=0;stick.style.left='50%';stick.style.top='50%'}
function finishPointer(e){const kind=pointers.get(e.pointerId);if(kind==='joy')resetJoy();if(kind&&kind!=='joy'){const b=document.getElementById(kind);if(b)b.classList.remove('down')}pointers.delete(e.pointerId)}
joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pointers.set(e.pointerId,'joy');try{joy.setPointerCapture(e.pointerId)}catch(_){}joyPoint(e)});
joy.addEventListener('pointermove',e=>{if(pointers.get(e.pointerId)==='joy'){e.preventDefault();joyPoint(e)}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(ev,finishPointer);
for(const k of ['q','e','r']){const b=document.getElementById(k);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pointers.set(e.pointerId,k);try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('down');skill(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{finishPointer(e)})}
document.getElementById('pause').addEventListener('pointerdown',e=>{e.preventDefault();paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';toast(paused?'PAUSED':'RESUME')});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['q','e','r'].includes(k)&&!e.repeat)skill(k);if(k==='escape')paused=!paused});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function damagePlayer(amount=18){if(player.guard>0){hurtBoss(45);player.guard=0;burst(player.x,player.y,'#b3f2ff',24);toast('COUNTER!');return}if(player.inv>0)return;player.hp=Math.max(0,player.hp-amount);player.inv=.9;shake=8;toast('− '+amount+' VITALITY');if(!player.hp)setTimeout(()=>finishGame(false),250)}
function pointSegmentDistance(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1,t=clamp(((px-x1)*dx+(py-y1)*dy)/l2,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
function update(dt){if(paused||ended)return;elapsed+=dt;for(const k in cd)cd[k]=Math.max(0,cd[k]-dt);player.inv=Math.max(0,player.inv-dt);player.guard=Math.max(0,player.guard-dt);player.dash=Math.max(0,player.dash-dt);player.attack=Math.max(0,player.attack-dt);
 let ix=move.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=move.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l;l=1}if(l>.08){player.dir=direction(ix,iy);player.x+=ix*player.speed*dt*(player.dash?2.4:1);player.y+=iy*player.speed*dt*(player.dash?2.4:1)}
 player.x=clamp(player.x,28,W-28);player.y=clamp(player.y,95,H-28);
 if(boss.hp>0){const ex=clamp((player.x-boss.x)/180,-1,1)*7,ey=clamp((player.y-boss.y)/180,-1,1)*7;boss.eyeX+=(ex-boss.eyeX)*Math.min(1,dt*7);boss.eyeY+=(ey-boss.eyeY)*Math.min(1,dt*7);const targetSquash=boss.state==='tell'?(boss.attack===0?1:boss.attack===1?.82:1.18):boss.state==='attack'?(boss.attack===0?-.35:boss.attack===1?-.12:.72):0;boss.squash+=(targetSquash-boss.squash)*Math.min(1,dt*(boss.state==='attack'?16:6));boss.timer-=dt;
 if(boss.state==='idle'&&boss.timer<=0){boss.state='tell';boss.attack=Math.random()<.25?0:(Math.random()<.54?1:2);boss.baseAngle=Math.atan2(player.y-boss.y,player.x-boss.x);boss.hit=false;boss.timer=boss.attack===0?.82:boss.attack===1?1.22:1.05;toast(boss.attack===0?'WARDEN · BODY CHARGE':boss.attack===1?'WARDEN · EYE SWEEP':'WARDEN · TONGUE LASH')}
 if(boss.state==='tell'&&boss.timer<=0){boss.state='attack';boss.timer=boss.attack===0?.48:boss.attack===1?1.12:.62;boss.hit=false}
 if(boss.state==='attack'){
  const duration=boss.attack===0?.48:boss.attack===1?1.12:.62,progress=clamp(1-boss.timer/duration,0,1),angle=boss.baseAngle||0;
  if(boss.attack===0){const dx=player.x-boss.x,dy=player.y-boss.y,len=Math.hypot(dx,dy)||1;boss.x+=dx/len*245*dt;boss.y+=dy/len*245*dt;if(!boss.hit&&Math.hypot(player.x-boss.x,player.y-boss.y)<58){damagePlayer(18);boss.hit=true}}
  if(!boss.hit&&boss.attack===1){const sweep=-.72+progress*1.44,pa=Math.atan2(player.y-boss.y,player.x-boss.x),delta=Math.atan2(Math.sin(pa-(angle+sweep)),Math.cos(pa-(angle+sweep))),dist=Math.hypot(player.x-boss.x,player.y-boss.y);if(dist<clamp(W*.25,175,245)&&Math.abs(delta)<.16&&progress>.12){damagePlayer(16);boss.hit=true}}
  if(!boss.hit&&boss.attack===2){const len=clamp(W*.29,215,285),dx=player.x-boss.x,dy=player.y-boss.y,along=dx*Math.cos(angle)+dy*Math.sin(angle),side=Math.abs(-dx*Math.sin(angle)+dy*Math.cos(angle));if(along>28&&along<len&&side<43&&progress>.22){damagePlayer(20);boss.hit=true}}
  if(boss.timer<=0){boss.state='idle';boss.timer=1.15+Math.random()*1.05}
 }
 }
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;f.r+=(f.max-f.r)*dt*7;if(f.t<=0)fx.splice(i,1)}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.94;s.vy*=.94;if(s.t<=0)sparks.splice(i,1)}
 if(toastTime>0){toastTime-=dt;if(toastTime<=0)document.getElementById('toast').classList.remove('show')}
 document.getElementById('playerFill').style.width=(player.hp/player.max*100)+'%';document.getElementById('bossFill').style.width=(boss.hp/boss.max*100)+'%';document.getElementById('playerNum').textContent=player.hp+' / 100';document.getElementById('bossNum').textContent=boss.hp+' / '+boss.max;
 for(const k of ['q','e','r']){const e=document.getElementById('c'+k);e.textContent=cd[k]>0?cd[k].toFixed(1)+'s':k.toUpperCase()+' READY';document.getElementById(k).style.opacity=cd[k]>0?'.62':'1'}
}
function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function path(target,points,color,width=2,alpha=1){target.save();target.globalAlpha=alpha;target.strokeStyle=color;target.lineWidth=width;target.lineJoin='miter';target.beginPath();points.forEach((p,i)=>i?target.lineTo(p[0],p[1]):target.moveTo(p[0],p[1]));target.stroke();target.restore()}
function drawFloor(){bgCtx.fillStyle='#090e20';bgCtx.fillRect(0,0,W,H);
 const tile=Math.max(34,Math.min(58,W/18)),cols=Math.ceil(W/tile)+2,rows=Math.ceil(H/tile)+3;

function drawWarden(){
 if(boss.hp<=0)return;
 const hop=Math.sin(elapsed*5.2)*2.8+(boss.state==='idle'?Math.max(0,Math.sin(elapsed*2.6))*3:0);
 const sx=1+(boss.squash||0)*.20,sy=1-(boss.squash||0)*.13;
 const w=clamp(W*.22,150,270),h=w*(wardenSprite.naturalHeight/wardenSprite.naturalWidth||.67);
 ctx.save();ctx.translate(Math.round(boss.x),Math.round(boss.y+hop));ctx.scale(sx,sy);
 ctx.fillStyle='#020611';ctx.beginPath();ctx.ellipse(0,h*.40,w*.46,h*.10,0,0,Math.PI*2);ctx.fill();
 if(wardenSprite.complete&&wardenSprite.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(wardenSprite,-w/2,-h*.58,w,h);ctx.imageSmoothingEnabled=true}
 ctx.restore()
}
function drawWardenAttack(){
 if(boss.state!=='tell'&&boss.state!=='attack')return;
 const angle=boss.baseAngle||0,tell=boss.state==='tell',duration=boss.attack===0?.48:boss.attack===1?1.12:.62,p=tell?0:clamp(1-boss.timer/duration,0,1);
 ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(angle);
 if(boss.attack===1){
  const sweep=tell?0:-.72+p*1.44,reach=tell?clamp(W*.11,75,110):clamp(W*.25,175,245);
  for(const side of [-1,1]){
   ctx.save();ctx.rotate(sweep+side*.24);
   const len=reach*(tell?.48:Math.min(1,p*4+.12));
   ctx.strokeStyle='#090e1c';ctx.lineWidth=19;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(7,side*17);ctx.quadraticCurveTo(len*.46,side*30,len,side*23);ctx.stroke();
   ctx.strokeStyle='#78869b';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(7,side*17);ctx.quadraticCurveTo(len*.46,side*30,len,side*23);ctx.stroke();
   ctx.fillStyle='#06132b';ctx.beginPath();ctx.arc(len,side*23,21,0,Math.PI*2);ctx.fill();
   const g=ctx.createRadialGradient(len-6,side*23-7,2,len,side*23,19);g.addColorStop(0,'#e8ffff');g.addColorStop(.25,'#50dcff');g.addColorStop(1,'#073ab8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(len,side*23,16,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#020817';ctx.beginPath();ctx.arc(len+5,side*23,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(len-6,side*23-8,5,0,Math.PI*2);ctx.fill();ctx.restore()
  }
  if(tell){ctx.strokeStyle='#ff789e';ctx.lineWidth=3;ctx.globalAlpha=.45+Math.sin(elapsed*13)*.22;ctx.beginPath();ctx.arc(0,0,reach*1.72,-.9,.9);ctx.stroke();ctx.fillStyle='#ff668e';ctx.globalAlpha=.12;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,reach*1.72,-.9,.9);ctx.closePath();ctx.fill()}
 }else if(boss.attack===2){
  const mouthOpen=tell?(.55+.45*Math.sin(elapsed*15)):(.65+Math.sin(p*Math.PI)*.35),len=tell?48:clamp(W*.29,215,285)*Math.min(1,p*5+.08);
  ctx.fillStyle='#0a0d19';ctx.beginPath();ctx.ellipse(12,8,25,12+mouthOpen*15,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#7b233e';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(12,8,25,12+mouthOpen*15,0,Math.PI,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#e9d8d0';ctx.beginPath();ctx.moveTo(-8,5);ctx.lineTo(4,13+mouthOpen*9);ctx.lineTo(15,5);ctx.fill();
  if(!tell){ctx.strokeStyle='#49152f';ctx.lineWidth=23;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(27,9);ctx.quadraticCurveTo(len*.58,3,len,9);ctx.stroke();ctx.strokeStyle='#e85b91';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(27,9);ctx.quadraticCurveTo(len*.58,3,len,9);ctx.stroke();ctx.strokeStyle='#ffb5d0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(35,5);ctx.quadraticCurveTo(len*.58,0,len,7);ctx.stroke();ctx.fillStyle='#ffd2df';ctx.beginPath();ctx.ellipse(len,9,15,8,0,0,Math.PI*2);ctx.fill()}
  else{ctx.strokeStyle='#ff789e';ctx.lineWidth=3;ctx.globalAlpha=.72;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(35,9);ctx.lineTo(clamp(W*.29,215,285),9);ctx.stroke();ctx.setLineDash([])}
 }else if(boss.attack===0){ctx.strokeStyle='#ff668e';ctx.lineWidth=4;ctx.globalAlpha=tell?.7:.35;ctx.beginPath();ctx.arc(0,0,68+Math.sin(elapsed*16)*5,0,Math.PI*2);ctx.stroke()}
 ctx.restore()
}

const palette={K:'#080d1b',H:'#344d77',F:'#d9efff',B:'#18365c',C:'#4d82b6',S:'#a9dfff'};ctx.save();ctx.translate(Math.round(player.x),Math.round(player.y+Math.sin(elapsed*10)*1.2));ctx.fillStyle='#030714';ctx.beginPath();ctx.ellipse(0,19,23,8,0,0,Math.PI*2);ctx.fill();const frame=Math.floor(elapsed*9)%2,scale=3.1,sprite=rows[player.dir]||rows.up;for(let y=0;y<sprite.length;y++)for(let x=0;x<sprite[y].length;x++){const ch=sprite[y][x];if(ch==='.')continue;ctx.fillStyle=palette[ch]||'#fff';let px=(x-8)*scale,py=(y-8)*scale;if(frame&&y>=12&&y<=14&&x<8)py+=1;ctx.fillRect(Math.round(px),Math.round(py),scale,scale)}ctx.fillStyle='#9edcff';if(player.dir==='left'){ctx.fillRect(-29,1,15,3);ctx.fillRect(-30,-2,3,9)}else if(player.dir==='right'){ctx.fillRect(14,1,15,3);ctx.fillRect(27,-2,3,9)}else{ctx.fillRect(18,8,3,15);ctx.fillStyle='#e8f8ff';ctx.fillRect(17,7,5,3)}if(player.attack>0){ctx.save();ctx.strokeStyle='#d7f5ff';ctx.lineWidth=4;ctx.shadowColor='#7ccfff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,43,player.dir==='left'?1.5:player.dir==='right'?-1:0,player.dir==='left'?4.3:player.dir==='right'?2.2:Math.PI*1.5);ctx.stroke();ctx.restore()}if(player.guard>0){ctx.save();ctx.strokeStyle='#9beaff';ctx.lineWidth=3;ctx.shadowColor='transparent';ctx.beginPath();ctx.arc(0,0,38,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#66cfff22';ctx.fill();ctx.restore()}if(player.inv>0&&Math.floor(elapsed*18)%2===0)ctx.globalAlpha=.35;ctx.restore()

function render(){ctx.save();ctx.fillStyle='#090e20';ctx.fillRect(0,0,W,H);if(bgCanvas.width&&bgCanvas.height)ctx.drawImage(bgCanvas,0,0,W,H);if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-.5)}if(boss.hp>0){if(boss.state==='tell'&&boss.attack===0){ctx.save();ctx.strokeStyle='#ff668e';ctx.lineWidth=3;ctx.shadowColor='transparent';ctx.globalAlpha=.5+Math.sin(elapsed*17)*.3;ctx.beginPath();ctx.arc(boss.x,boss.y,95,0,Math.PI*2);ctx.stroke();ctx.restore()}drawWarden();drawWardenAttack()}
 drawHero();
 for(const f of fx){ctx.save();ctx.globalAlpha=Math.max(0,f.t/.48);ctx.strokeStyle=f.color;ctx.lineWidth=4;ctx.shadowColor='transparent';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.stroke();ctx.restore()}

})();
